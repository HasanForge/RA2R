name: Build RA2R (x86)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install i686 MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake unzip
          i686-w64-mingw32-g++ --version

      - name: Download SDL3 (i686 mingw devel package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo libsdl-org/SDL --pattern "SDL3-devel-3.4*-mingw.zip" -D sdl3dl
          mkdir sdl3
          unzip -q sdl3dl/*.zip -d sdl3
          echo "SDL3_PREFIX=$(find sdl3 -maxdepth 2 -type d -name 'i686-w64-mingw32')" >> "$GITHUB_ENV"

      - name: Configure (i686 cross-compile)
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
            -DCMAKE_PREFIX_PATH="$SDL3_PREFIX"

      - name: Build
        run: cmake --build build -j

      - name: Stage SDL3.dll next to the binaries
        run: cp "$SDL3_PREFIX/bin/SDL3.dll" build/tools/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RA2R-x86
          path: build/tools/
