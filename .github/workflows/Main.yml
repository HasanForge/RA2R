name: Build RA2R (x86)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW32 / i686)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make

      - name: Download SDL3 (i686 mingw devel package)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo libsdl-org/SDL --pattern "SDL3-devel-3.4*-mingw.zip" -D sdl3dl
          Expand-Archive -Path sdl3dl\*.zip -DestinationPath sdl3

      - name: Locate SDL3 i686 prefix
        id: sdl
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Directory -Filter "i686-w64-mingw32" sdl3 | Select-Object -First 1
          "prefix=$($p.FullName -replace '\\','/')" >> $env:GITHUB_OUTPUT

      - name: Configure (i686)
        shell: msys2 {0}
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Stage SDL3.dll next to the binaries
        shell: pwsh
        run: Copy-Item "${{ steps.sdl.outputs.prefix }}\bin\SDL3.dll" build\tools\

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RA2R-x86
          path: build/tools/
          
